build:
  name: Build Flutter iOS App
  steps:
    - eas/checkout
    - eas/install_node_modules
    - run:
        name: Install Flutter dependencies and build IPA
        command: |
          unset FLUTTER_BUILD_NAME
          unset FLUTTER_BUILD_NUMBER
          flutter pub get
          flutter build ipa --release --export-options-plist=/Users/expo/exportOptions.plist
